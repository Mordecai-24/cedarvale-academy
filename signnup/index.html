<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Cedarvale Academy</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <main class="signup">

        <!-- LEFT -->

        <section class="signup__image">

            <div class="signup__overlay"></div>

            <div class="signup__image-content">

                <h1>Your Learning Journey Starts Here</h1>

                <p>
                    Join the Cedarvale Academy portal and access academic
                    information, learning materials and school updates.
                </p>

            </div>

        </section>


        <!-- RIGHT -->

        <section class="signup__content">

            <div class="signup__wrapper">

                <img
                    src="../assets/logo/logo.png"
                    alt="Cedarvale Academy Logo"
                    class="signup__logo"
                >

                <h2>Create Your Account</h2>

                <p class="signup__description">
                    Enter your details to register for the school portal.
                </p>


                <form class="signup__form">


                    <div class="form__group">

                        <label for="username">
                            Admission Number / Staff ID
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your ID number"
                        >

                    </div>


                    <div class="form__group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                        >

                    </div>


                    <div class="form__group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm your password"
                        >

                    </div>


                    <div class="signup__role">

                        <p>Register as:</p>

                        <label>
                            <input
                                type="radio"
                                name="role"
                                value="student"
                            >

                            Student
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="role"
                                value="teacher"
                            >

                            Teacher
                        </label>

                    </div>


                    <button type="submit" class="signup__button">
                        Create Account
                    </button>

                </form>


                <p class="signup__login">

                    Already have an account?
                    <a href="../login/index.html">Sign In</a>
                </p>

            </div>

        </section>

    </main>

</body>
</html>
