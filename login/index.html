<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal | Cedarvale Academy</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login">

        <!-- LEFT SIDE -->

        <section class="login__image">

            <div class="login__overlay"></div>

            <div class="login__image-content">
                <h1>Learn. Grow. Succeed.</h1>

                <p>
                    Access your academic information and learning resources
                    through the Cedarvale Academy portal.
                </p>
            </div>

        </section>


        <!-- RIGHT SIDE -->

        <section class="login__content">

            <div class="login__wrapper">

                <img
                    src="../assets/logo/logo.png"
                    alt="Cedarvale Academy Logo"
                    class="login__logo"
                >

                <h2>Welcome Back</h2>

                <p class="login__description">
                    Enter your details to access your school portal.
                </p>


                <form class="login__form">

                    <div class="form__group">

                        <label for="username">
                            Admission Number / Staff ID
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your admission number"
                        >

                    </div>


                    <div class="form__group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                        >

                    </div>


                    <div class="login__options">

                        <label class="remember">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <button type="submit" class="login__button">
                        Sign In
                    </button>

                </form>


                <p class="login__signup">
                    Don't have an account?
                    <a href="../signnup/index.html">Create Account</a>
                </p>

            </div>

        </section>

    </main>

</body>
</html>
